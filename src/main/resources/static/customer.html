<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customers - Field Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
        }

        .sidebar {
            min-height: 100vh;
            background: #212529;
        }

        .sidebar h3 {
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            padding: 12px 20px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #343a40;
            color: white;
        }

        .content {
            padding: 30px;
        }

        .card {
            border: none;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">

            <h3>Field Service</h3>

            <a href="/dashboard.html">Dashboard</a>
            <a href="/customer.html">Customers</a>
            <a href="/site.html">Sites</a>
            <a href="/workorder.html">Work Orders</a>
            <a href="/technician.html">Technicians</a>
            <a href="/login.html">Logout</a>

        </div>

        <!-- Main Content -->
        <div class="col-md-10">

            <div class="content">

                <h2>Customers</h2>

                <p class="text-muted">
                    Manage Field Service Customers
                </p>

                <div class="card shadow-sm mt-4 p-4">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h5>Customer List</h5>

                        <a href="/add-customer.html" class="btn btn-primary">
                            + Add Customer
                        </a>

                    </div>

                    <table class="table table-bordered">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Company Name</th>
                                <th>Contact Person</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Action</th>
                            </tr>
                        </thead>

                        <tbody id="customerTableBody">
                            <!-- Customers will load here -->
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>
</div>


<script>

    // Load all customers
    function loadCustomers() {

        fetch("/api/customer/all")
            .then(response => {

                if (!response.ok) {
                    throw new Error("Failed to load customers");
                }

                return response.json();
            })
            .then(customers => {

                const tableBody =
                    document.getElementById("customerTableBody");

                tableBody.innerHTML = "";

                if (customers.length === 0) {

                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="6" class="text-center">
                                No customers found
                            </td>
                        </tr>
                    `;

                    return;
                }

                customers.forEach(customer => {

                    const row = document.createElement("tr");

                    row.innerHTML = `
                    	<td>${customers.indexOf(customer) + 1}</td>

                        <td>
                            ${customer.companyName || customer.CompanyName || ""}
                        </td>

                        <td>
                            ${customer.contactPerson || customer.ContactPerson || ""}
                        </td>

                        <td>
                            ${customer.email || ""}
                        </td>

                        <td>
                            ${customer.phone || ""}
                        </td>

                        <td>

                            <button
                                class="btn btn-sm btn-warning"
                                onclick="editCustomer(${customer.id})">
                                Edit
                            </button>

                            <button
                                class="btn btn-sm btn-danger"
                                onclick="deleteCustomer(${customer.id})">
                                Delete
                            </button>

                        </td>
                    `;

                    tableBody.appendChild(row);

                });

            })
            .catch(error => {

                console.error(error);

                document.getElementById("customerTableBody").innerHTML = `
                    <tr>
                        <td colspan="6" class="text-center text-danger">
                            Failed to load customers
                        </td>
                    </tr>
                `;

            });
    }


    // Delete customer
    function deleteCustomer(id) {

        if (!confirm("Are you sure you want to delete this customer?")) {
            return;
        }

        fetch("/api/customer/" + id, {
            method: "DELETE"
        })
        .then(response => {

            if (!response.ok) {
                throw new Error("Delete failed");
            }

            return response.text();

        })
        .then(message => {

            alert(message);

            loadCustomers();

        })
        .catch(error => {

            console.error(error);

            alert("Failed to delete customer");

        });
    }

 // Edit customer
    function editCustomer(id) {

        window.location.href = "/add-customer.html?id=" + id;

    }
    
    // Load customers when page opens
    loadCustomers();

</script>

</body>
</html>
