<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technicians - Field Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
        }

        .sidebar {
            min-height: 100vh;
            background: #212529;
        }

        .sidebar h3 {
            color: white;
            padding: 20px;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            padding: 12px 20px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background: #343a40;
            color: white;
        }

        .content {
            padding: 30px;
        }

        .card {
            border: none;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar p-0">

            <h3>Field Service</h3>

            <a href="/dashboard.html">Dashboard</a>
            <a href="/customer.html">Customers</a>
            <a href="/site.html">Sites</a>
            <a href="/workorder.html">Work Orders</a>
            <a href="/technician.html">Technicians</a>
            <a href="/login.html">Logout</a>

        </div>

        <!-- Main Content -->
        <div class="col-md-10">

            <div class="content">

                <h2>Technicians</h2>
                <p class="text-muted">
                    Manage Field Service Technicians
                </p>

                <div class="card shadow-sm mt-4 p-4">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <h5>Technician List</h5>

                        <button
    class="btn btn-primary"
    onclick="window.location.href='/add-technician.html'">
    + Add Technician
</button>

                    </div>

                    <table class="table table-bordered">

                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Action</th>
                            </tr>
                      
                      <tbody id="technicianTableBody">
</tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>
</div>

<script>

function loadTechnicians() {

    fetch("/api/technician/all")

        .then(response => {
            if (!response.ok) {
                throw new Error("Failed to load technicians");
            }
            return response.json();
        })

        .then(technicians => {

            const tableBody =
                document.getElementById("technicianTableBody");

            tableBody.innerHTML = "";

            if (technicians.length === 0) {

                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="text-center">
                            No technicians found
                        </td>
                    </tr>
                `;

                return;
            }

            technicians.forEach(technician => {

                const row = document.createElement("tr");

                row.innerHTML = `
                    <td>${technicians.indexOf(technician) + 1}</td>
                    <td>${technician.userName}</td>
                    <td>${technician.userEmail}</td>
                    <td>${technician.phone || ""}</td>
                    <td>
                        <button
                            class="btn btn-sm btn-warning"
                            onclick="window.location.href='/edit-technician.html?id=${technician.id}'">
                            Edit
                        </button>

                        <button
                            class="btn btn-sm btn-danger"
                            onclick="deleteTechnician(${technician.id})">
                            Delete
                        </button>
                    </td>
                `;

                tableBody.appendChild(row);

            });

        })

        .catch(error => {

            console.error(error);

            document.getElementById("technicianTableBody").innerHTML = `
                <tr>
                    <td colspan="5" class="text-center text-danger">
                        Failed to load technicians
                    </td>
                </tr>
            `;

        });
}

function deleteTechnician(id) {
    if (!confirm("Are you sure you want to delete this technician?")) {
        return;
    }

    fetch("/api/technician/delete/" + id, {
        method: "DELETE"
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Delete failed");
        }
        return response.text();
    })
    .then(message => {
        alert(message);
        loadTechnicians();
    })
    .catch(error => {
        console.error(error);
        alert("Failed to delete technician");
    });
}

loadTechnicians();

</script>

</body>
</html>
