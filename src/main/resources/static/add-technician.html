<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Technician - Field Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
        }

        .card {
            border: none;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">Add Technician</h2>

        <form id="technicianForm">

            <!-- Name -->
            <div class="mb-3">
                <label class="form-label">Name</label>

                <input
                    type="text"
                    id="userName"
                    class="form-control"
                    placeholder="Enter technician name"
                    required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>

                <input
                    type="email"
                    id="userEmail"
                    class="form-control"
                    placeholder="Enter technician email"
                    required>
            </div>

            <!-- Phone -->
            <div class="mb-3">
                <label class="form-label">Phone</label>

                <input
                    type="text"
                    id="phone"
                    class="form-control"
                    placeholder="Enter phone number"
                    required>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter password"
                    required>
            </div>

            <!-- Buttons -->
            <button
                type="submit"
                class="btn btn-primary">
                Add Technician
            </button>

            <a
                href="/technician.html"
                class="btn btn-secondary">
                Cancel
            </a>

        </form>

        <p id="message" class="mt-3"></p>

    </div>

</div>

<script>

document.getElementById("technicianForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const technicianData = {

            userName:
                document.getElementById("userName").value,

            userEmail:
                document.getElementById("userEmail").value,

            phone:
                document.getElementById("phone").value,

            password:
                document.getElementById("password").value,

            role: "TECHNICIAN"
        };

        try {

            const response = await fetch(
                "/api/user_auth/register",
                {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(technicianData)
                }
            );

            const messageText = await response.text();

            if (!response.ok) {
                throw new Error(messageText);
            }

            document.getElementById("message").innerText =
                "Technician added successfully";

            document.getElementById("message")
                .className = "mt-3 text-success";

            document.getElementById("technicianForm").reset();

            setTimeout(function() {

                window.location.href = "/technician.html";

            }, 1000);

        } catch (error) {

            console.error(error);

            document.getElementById("message").innerText =
                error.message || "Failed to add technician";

            document.getElementById("message")
                .className = "mt-3 text-danger";
        }

    });

</script>

</body>
</html>
