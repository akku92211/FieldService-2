<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Work Orders - Field Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>

        body {
            background-color: #f5f6fa;
        }

        .sidebar {
            min-height: 100vh;
            background-color: #212529;
            padding: 20px;
        }

        .sidebar h3 {
            color: white;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background-color: #343a40;
            color: white;
        }

        .content {
            padding: 30px;
        }

        .card {
            border: none;
            border-radius: 12px;
        }

        .edit-box {
            border-left: 5px solid #ffc107;
        }

    </style>

</head>


<body>


<div class="container-fluid">

    <div class="row">


        <!-- ================= SIDEBAR ================= -->

        <div class="col-md-2 sidebar">

            <h3>Field Service</h3>

            <a href="index.html">Dashboard</a>

            <a href="customer.html">Customers</a>

            <a href="site.html">Sites</a>

            <a href="workorder.html">Work Orders</a>

            <a href="#">Technicians</a>

            <a href="login.html">Logout</a>

        </div>


        <!-- ================= MAIN ================= -->

        <div class="col-md-10 content">


            <!-- HEADER -->

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h2>Work Orders</h2>

                <button
                    type="button"
                    class="btn btn-primary"
                    onclick="showCreateForm()">

                    + Create Work Order

                </button>

            </div>



            <!-- ================= FORM ================= -->

            <div
                id="workOrderFormCard"
                class="card shadow-sm p-4 mb-4">

                <h5
                    id="formHeading"
                    class="mb-3">

                    Create Work Order

                </h5>


                <form id="workOrderForm">

                    <!-- EDIT ID -->

                    <input
                        type="hidden"
                        id="editWorkOrderId">


                    <div class="row">


                        <!-- TITLE -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Title
                            </label>

                            <input
                                type="text"
                                id="title"
                                class="form-control"
                                placeholder="Enter work order title"
                                required>

                        </div>



                        <!-- PRIORITY -->

                        <div class="col-md-6 mb-3">

                            <label class="form-label">
                                Priority
                            </label>

                            <select
                                id="priority"
                                class="form-select"
                                required>

                                <option value="">
                                    Select Priority
                                </option>

                                <option value="LOW">
                                    LOW
                                </option>

                                <option value="MEDIUM">
                                    MEDIUM
                                </option>

                                <option value="HIGH">
                                    HIGH
                                </option>

                                <option value="URGENT">
                                    URGENT
                                </option>

                            </select>

                        </div>



                        <!-- DESCRIPTION -->

                        <div class="col-md-12 mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea
                                id="description"
                                class="form-control"
                                rows="3"
                                placeholder="Enter work order description">
                            </textarea>

                        </div>



                        <!-- CUSTOMER -->

                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Customer ID
                            </label>

                            <input
                                type="number"
                                id="customerId"
                                class="form-control"
                                placeholder="Customer ID"
                                required>

                        </div>



                        <!-- SITE -->

                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Site ID
                            </label>

                            <input
                                type="number"
                                id="siteId"
                                class="form-control"
                                placeholder="Site ID"
                                required>

                        </div>



                        <!-- TECHNICIAN -->

                        <div class="col-md-4 mb-3">

                            <label class="form-label">
                                Technician ID
                            </label>

                            <input
                                type="number"
                                id="technicianId"
                                class="form-control"
                                placeholder="Technician ID">

                        </div>

                    </div>



                    <!-- BUTTON -->

                    <button
                        type="submit"
                        id="submitButton"
                        class="btn btn-success">

                        Create Work Order

                    </button>


                    <button
                        type="button"
                        id="cancelEditButton"
                        class="btn btn-secondary ms-2"
                        style="display:none;"
                        onclick="cancelEdit()">

                        Cancel Edit

                    </button>

                </form>

            </div>



            <!-- ================= LIST ================= -->

            <div class="card shadow-sm p-4">

                <h5 class="mb-3">
                    Work Order List
                </h5>


                <div class="table-responsive">

                    <table
                        class="table table-bordered table-hover">

                        <thead class="table-dark">

                            <tr>

                                <th>ID</th>

                                <th>Title</th>

                                <th>Priority</th>

                                <th>Status</th>

                                <th>Customer</th>

                                <th>Technician</th>

                                <th>Action</th>

                            </tr>

                        </thead>


                        <tbody id="workOrderTableBody">

                            <tr>

                                <td
                                    colspan="7"
                                    class="text-center">

                                    Loading work orders...

                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>



<script>


/* =========================================================
   TOKEN
========================================================= */

function getToken() {

    return localStorage.getItem("token");

}



/* =========================================================
   CREATE FORM
========================================================= */

function showCreateForm() {

    document.getElementById("workOrderForm").reset();

    document.getElementById("editWorkOrderId").value = "";

    document.getElementById("formHeading").innerText =
        "Create Work Order";

    document.getElementById("submitButton").innerText =
        "Create Work Order";

    document.getElementById("submitButton").className =
        "btn btn-success";

    document.getElementById("cancelEditButton").style.display =
        "none";

    document.getElementById("workOrderFormCard")
        .classList.remove("edit-box");

    document.getElementById("workOrderFormCard")
        .scrollIntoView({
            behavior: "smooth"
        });

}



/* =========================================================
   CREATE / UPDATE
========================================================= */

document
    .getElementById("workOrderForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();


        const editId =
            document.getElementById("editWorkOrderId").value;


        const title =
            document.getElementById("title").value.trim();


        const priority =
            document.getElementById("priority").value;


        const description =
            document.getElementById("description").value.trim();


        const customerId =
            document.getElementById("customerId").value;


        const siteId =
            document.getElementById("siteId").value;


        const technicianId =
            document.getElementById("technicianId").value;



        const workOrder = {

            title: title,

            priority: priority,

            description: description

        };



        if (customerId) {

            workOrder.customer = {

                id: Number(customerId)

            };

        }



        if (siteId) {

            workOrder.site = {

                id: Number(siteId)

            };

        }



        if (technicianId) {

            workOrder.technician = {

                id: Number(technicianId)

            };

        }



        let url = "/api/workorders";

        let method = "POST";


        if (editId) {

            url =
                "/api/workorders/" + editId;

            method = "PUT";

        }



        console.log("METHOD:", method);

        console.log("URL:", url);

        console.log("DATA:", workOrder);



        try {


            const response = await fetch(url, {

                method: method,

                headers: {

                    "Content-Type":
                        "application/json",

                    "Authorization":
                        "Bearer " + getToken()

                },

                body:
                    JSON.stringify(workOrder)

            });



            const responseText =
                await response.text();



            console.log(
                "Update/Create Status:",
                response.status
            );


            console.log(
                "Server Response:",
                responseText
            );



            if (!response.ok) {

                throw new Error(
                    responseText ||
                    "Request failed"
                );

            }



            if (editId) {

                alert(
                    "Work Order updated successfully!"
                );

            } else {

                alert(
                    "Work Order created successfully!"
                );

            }



            cancelEdit();

            loadWorkOrders();


        } catch (error) {

            console.error(
                "SAVE ERROR:",
                error
            );


            alert(
                "Work Order save nahi hua.\n\n" +
                error.message
            );

        }

    });



/* =========================================================
   LOAD WORK ORDERS
========================================================= */

async function loadWorkOrders() {

    const tableBody =
        document.getElementById(
            "workOrderTableBody"
        );


    try {


        const response = await fetch(
            "/api/workorders",
            {

                method: "GET",

                headers: {

                    "Authorization":
                        "Bearer " + getToken(),

                    "Content-Type":
                        "application/json"

                }

            }
        );



        const text =
            await response.text();



        console.log(
            "LOAD STATUS:",
            response.status
        );


        console.log(
            "LOAD RESPONSE:",
            text
        );



        if (!response.ok) {

            throw new Error(
                text ||
                "Failed to load work orders"
            );

        }



        const result =
            JSON.parse(text);



        let workOrders = result;



        if (
            result &&
            Array.isArray(result.content)
        ) {

            workOrders =
                result.content;

        }


        else if (
            result &&
            Array.isArray(result.data)
        ) {

            workOrders =
                result.data;

        }



        tableBody.innerHTML = "";



        if (
            !Array.isArray(workOrders) ||
            workOrders.length === 0
        ) {

            tableBody.innerHTML = `

                <tr>

                    <td
                        colspan="7"
                        class="text-center">

                        No work orders found

                    </td>

                </tr>

            `;

            return;

        }



        workOrders.forEach(function(workOrder) {


            const row =
                document.createElement("tr");



            const customerName =
                workOrder.customer
                    ? (
                        workOrder.customer.companyName
                        ||
                        workOrder.customer.CompanyName
                        ||
                        workOrder.customer.contactPerson
                        ||
                        workOrder.customer.email
                        ||
                        ""
                    )
                    : "";



            const technicianName =
                workOrder.technician
                    ? (
                        workOrder.technician.userName
                        ||
                        workOrder.technician.name
                        ||
                        workOrder.technician.userEmail
                        ||
                        ""
                    )
                    : "";



            row.innerHTML = `

                <td>
                    ${workOrder.id ?? ""}
                </td>


                <td>
                    ${workOrder.title ?? ""}
                </td>


                <td>

                    <span class="badge bg-danger">

                        ${workOrder.priority ?? ""}

                    </span>

                </td>


                <td>

                    <span class="badge bg-primary">

                        ${workOrder.status ?? ""}

                    </span>

                </td>


                <td>

                    ${customerName}

                </td>


                <td>

                    ${technicianName}

                </td>


                <td>

                    <button
                        type="button"
                        class="btn btn-sm btn-warning me-1"
                        onclick="editWorkOrder(${workOrder.id})">

                        Edit

                    </button>


                    <button
                        type="button"
                        class="btn btn-sm btn-danger"
                        onclick="deleteWorkOrder(${workOrder.id})">

                        Delete

                    </button>

                </td>

            `;


            tableBody.appendChild(row);

        });


    } catch (error) {


        console.error(
            "LOAD ERROR:",
            error
        );


        tableBody.innerHTML = `

            <tr>

                <td
                    colspan="7"
                    class="text-center text-danger">

                    Failed to load work orders

                </td>

            </tr>

        `;

    }

}



/* =========================================================
   EDIT WORK ORDER
========================================================= */

async function editWorkOrder(id) {


    console.log(
        "EDIT CLICKED - ID:",
        id
    );


    try {


        const response = await fetch(
            "/api/workorders/" + id,
            {

                method: "GET",

                headers: {

                    "Authorization":
                        "Bearer " + getToken(),

                    "Content-Type":
                        "application/json"

                }

            }
        );



        const text =
            await response.text();



        console.log(
            "EDIT STATUS:",
            response.status
        );


        console.log(
            "EDIT RESPONSE:",
            text
        );



        if (!response.ok) {

            throw new Error(
                text ||
                "Unable to load Work Order"
            );

        }



        const workOrder =
            JSON.parse(text);



        console.log(
            "EDIT OBJECT:",
            workOrder
        );



        /* ID */

        document.getElementById(
            "editWorkOrderId"
        ).value =
            workOrder.id;



        /* TITLE */

        document.getElementById(
            "title"
        ).value =
            workOrder.title || "";



        /* PRIORITY */

        document.getElementById(
            "priority"
        ).value =
            workOrder.priority || "";



        /* DESCRIPTION */

        document.getElementById(
            "description"
        ).value =
            workOrder.description || "";



        /* CUSTOMER */

        document.getElementById(
            "customerId"
        ).value =
            workOrder.customer &&
            workOrder.customer.id
                ? workOrder.customer.id
                : "";



        /* SITE */

        document.getElementById(
            "siteId"
        ).value =
            workOrder.site &&
            workOrder.site.id
                ? workOrder.site.id
                : "";



        /* TECHNICIAN */

        document.getElementById(
            "technicianId"
        ).value =
            workOrder.technician &&
            workOrder.technician.id
                ? workOrder.technician.id
                : "";



        /* EDIT MODE */

        document.getElementById(
            "formHeading"
        ).innerText =
            "Edit Work Order";



        document.getElementById(
            "submitButton"
        ).innerText =
            "Update Work Order";



        document.getElementById(
            "submitButton"
        ).className =
            "btn btn-warning";



        document.getElementById(
            "cancelEditButton"
        ).style.display =
            "inline-block";



        document.getElementById(
            "workOrderFormCard"
        ).classList.add("edit-box");



        document.getElementById(
            "workOrderFormCard"
        ).scrollIntoView({
            behavior: "smooth"
        });


    } catch (error) {


        console.error(
            "EDIT ERROR:",
            error
        );


        alert(
            "Work Order load nahi hua.\n\n" +
            error.message
        );

    }

}



/* =========================================================
   CANCEL EDIT
========================================================= */

function cancelEdit() {


    document.getElementById(
        "workOrderForm"
    ).reset();


    document.getElementById(
        "editWorkOrderId"
    ).value = "";


    document.getElementById(
        "formHeading"
    ).innerText =
        "Create Work Order";


    document.getElementById(
        "submitButton"
    ).innerText =
        "Create Work Order";


    document.getElementById(
        "submitButton"
    ).className =
        "btn btn-success";


    document.getElementById(
        "cancelEditButton"
    ).style.display =
        "none";


    document.getElementById(
        "workOrderFormCard"
    ).classList.remove("edit-box");

}



/* =========================================================
   DELETE
========================================================= */

async function deleteWorkOrder(id) {


    if (
        !confirm(
            "Are you sure you want to delete this work order?"
        )
    ) {

        return;

    }



    try {


        const response =
            await fetch(
                "/api/workorders/" + id,
                {

                    method: "DELETE",

                    headers: {

                        "Authorization":
                            "Bearer " + getToken()

                    }

                }
            );



        const text =
            await response.text();



        console.log(
            "DELETE STATUS:",
            response.status
        );


        console.log(
            "DELETE RESPONSE:",
            text
        );



        if (!response.ok) {

            throw new Error(
                text ||
                "Delete failed"
            );

        }



        alert(
            text ||
            "Work Order deleted successfully!"
        );


        loadWorkOrders();


    } catch (error) {


        console.error(
            "DELETE ERROR:",
            error
        );


        alert(
            "Work Order delete nahi hua.\n\n" +
            error.message
        );

    }

}



/* =========================================================
   INITIAL LOAD
========================================================= */

loadWorkOrders();


</script>


</body>

</html>
