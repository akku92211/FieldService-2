<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sites - Field Service</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f5f6fa;
        }

        .sidebar {
            min-height: 100vh;
            background-color: #212529;
            padding: 20px;
        }

        .sidebar h3 {
            color: white;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: #ddd;
            text-decoration: none;
            padding: 12px;
            margin-bottom: 5px;
            border-radius: 5px;
        }

        .sidebar a:hover {
            background-color: #343a40;
            color: white;
        }

        .content {
            padding: 30px;
        }

        .card {
            border: none;
            border-radius: 12px;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- Sidebar -->
        <div class="col-md-2 sidebar">

            <h3>Field Service</h3>

            <a href="index.html">Dashboard</a>
            <a href="customer.html">Customers</a>
            <a href="site.html">Sites</a>
            <a href="workorder.html">Work Orders</a>
            <a href="#">Technicians</a>
            <a href="login.html">Logout</a>

        </div>

        <!-- Main Content -->
        <div class="col-md-10 content">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Sites</h2>

                <button class="btn btn-primary" type="button">
                    + Add Site
                </button>
            </div>

            <!-- Add Site Form -->
            <div class="card shadow-sm p-4 mb-4">

                <h5 class="mb-3">Add Site</h5>

                <form id="siteForm">

                    <div class="row">

                        <!-- Site Name -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Site Name</label>
                            <input type="text"
                                   class="form-control"
                                   id="siteName"
                                   placeholder="Enter site name"
                                   required>
                        </div>

                        <!-- Apartment Name -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Apartment Name</label>
                            <input type="text"
                                   class="form-control"
                                   id="apartmentName"
                                   placeholder="Enter apartment name">
                        </div>

                        <!-- Floor -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Floor No</label>
                            <input type="text"
                                   class="form-control"
                                   id="floorNo"
                                   placeholder="Enter floor number">
                        </div>

                        <!-- Address -->
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Address Details</label>
                            <input type="text"
                                   class="form-control"
                                   id="address"
                                   placeholder="Enter address">
                        </div>

                        <!-- City -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">City</label>
                            <input type="text"
                                   class="form-control"
                                   id="city"
                                   placeholder="Enter city">
                        </div>

                        <!-- State -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">State</label>
                            <input type="text"
                                   class="form-control"
                                   id="state"
                                   placeholder="Enter state">
                        </div>

                        <!-- Country -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Country</label>
                            <input type="text"
                                   class="form-control"
                                   id="country"
                                   placeholder="Enter country">
                        </div>

                        <!-- Zip Code -->
                        <div class="col-md-4 mb-3">
                            <label class="form-label">Zip Code</label>
                            <input type="number"
                                   class="form-control"
                                   id="zipCode"
                                   placeholder="Enter zip code">
                        </div>

                    </div>

                    <button type="submit" class="btn btn-success">
                        Save Site
                    </button>

                </form>

            </div>

            <!-- Site List -->
            <div class="card shadow-sm p-4">

                <h5 class="mb-3">Site List</h5>

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Site Name</th>
                            <th>Apartment</th>
                            <th>Floor</th>
                            <th>City</th>
                            <th>State</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="siteTableBody">

                        <tr>
                            <td colspan="7" class="text-center">
                                Loading sites...
                            </td>
                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>
</div>

<script>

let editSiteId = null;


// SAVE / UPDATE SITE
document.getElementById("siteForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const siteData = {
        siteName: document.getElementById("siteName").value,
        appartmentName: document.getElementById("apartmentName").value,
        floorNo: document.getElementById("floorNo").value,
        addressDetails: document.getElementById("address").value,
        city: document.getElementById("city").value,
        state: document.getElementById("state").value,
        country: document.getElementById("country").value,
        zipCode: Number(document.getElementById("zipCode").value),
        customer: {
            id: 1
        }
    };

    let url;
    let method;

    if (editSiteId === null) {
        // CREATE
        url = "/api/site/create";
        method = "POST";
    } else {
        // UPDATE
        url = "/api/site/update/" + editSiteId;
        method = "PUT";
    }

    fetch(url, {
        method: method,
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(siteData)
    })
    .then(response => {

        if (!response.ok) {
            throw new Error("Site save/update failed");
        }

        return response.json();
    })
    .then(data => {

        if (editSiteId === null) {
            alert("Site saved successfully!");
        } else {
            alert("Site updated successfully!");
        }

        editSiteId = null;

        document.getElementById("siteForm").reset();

        document.querySelector("#siteForm button[type='submit']").innerText = "Save Site";

        loadSites();
    })
    .catch(error => {

        console.error(error);

        alert("Error: " + error.message);
    });

});


// LOAD SITES
function loadSites() {

    fetch("/api/site/all")

    .then(response => {

        if (!response.ok) {
            throw new Error("Unable to load sites");
        }

        return response.json();
    })

    .then(sites => {

        const tableBody = document.getElementById("siteTableBody");

        tableBody.innerHTML = "";

        if (sites.length === 0) {

            tableBody.innerHTML =
                `<tr>
                    <td colspan="7" class="text-center">
                        No sites found
                    </td>
                </tr>`;

            return;
        }

        sites.forEach(site => {

            const row = document.createElement("tr");

            row.innerHTML = `
            	<td>${sites.indexOf(site) + 1}</td>
                <td>${site.siteName ?? ""}</td>
                <td>${site.appartmentName ?? ""}</td>
                <td>${site.floorNo ?? ""}</td>
                <td>${site.city ?? ""}</td>
                <td>${site.state ?? ""}</td>

                <td>
                    <button
                        class="btn btn-sm btn-warning"
                        onclick="editSite(${site.id})">
                        Edit
                    </button>

                    <button
                        class="btn btn-sm btn-danger"
                        onclick="deleteSite(${site.id})">
                        Delete
                    </button>
                </td>
            `;

            tableBody.appendChild(row);

        });

    })

    .catch(error => {

        console.error(error);

        document.getElementById("siteTableBody").innerHTML =
            `<tr>
                <td colspan="7" class="text-center text-danger">
                    Unable to load sites
                </td>
            </tr>`;

    });
}


// EDIT SITE
function editSite(id) {

    fetch("/api/site/" + id)

    .then(response => {

        if (!response.ok) {
            throw new Error("Unable to get site");
        }

        return response.json();
    })

    .then(site => {

        editSiteId = site.id;

        document.getElementById("siteName").value =
            site.siteName ?? "";

        document.getElementById("apartmentName").value =
            site.appartmentName ?? "";

        document.getElementById("floorNo").value =
            site.floorNo ?? "";

        document.getElementById("address").value =
            site.addressDetails ?? "";

        document.getElementById("city").value =
            site.city ?? "";

        document.getElementById("state").value =
            site.state ?? "";

        document.getElementById("country").value =
            site.country ?? "";

        document.getElementById("zipCode").value =
            site.zipCode ?? "";

        document.querySelector("#siteForm button[type='submit']").innerText =
            "Update Site";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    })

    .catch(error => {

        console.error(error);

        alert("Error loading site");

    });

}


// DELETE SITE
function deleteSite(id) {

    if (!confirm("Are you sure you want to delete this site?")) {
        return;
    }

    fetch("/api/site/" + id, {
        method: "DELETE"
    })

    .then(response => {

        if (!response.ok) {
            throw new Error("Delete failed");
        }

        return response.text();
    })

    .then(message => {

        alert("Site deleted successfully!");

        loadSites();

    })

    .catch(error => {

        console.error(error);

        alert("Error deleting site");

    });

}


// LOAD DATA WHEN PAGE OPENS
window.onload = function() {

    loadSites();

};

</script>

</body>
</html>
