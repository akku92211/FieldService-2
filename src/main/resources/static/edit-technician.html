<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Technician - Field Service</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h2 class="mb-4">Edit Technician</h2>

        <form id="technicianForm">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input
                    type="text"
                    id="userName"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input
                    type="email"
                    id="userEmail"
                    class="form-control"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input
                    type="text"
                    id="phone"
                    class="form-control">
            </div>

            <button
                type="submit"
                class="btn btn-primary">
                Update Technician
            </button>

            <a
                href="/technician.html"
                class="btn btn-secondary">
                Cancel
            </a>

        </form>

        <p id="message" class="mt-3"></p>

    </div>

</div>

<script>

const urlParams = new URLSearchParams(window.location.search);

const technicianId = urlParams.get("id");


/* Load technician data */

fetch("/api/technician/all")

    .then(response => response.json())

    .then(technicians => {

        const technician =
            technicians.find(t => t.id == technicianId);

        if (!technician) {
            document.getElementById("message").innerText =
                "Technician not found";
            return;
        }

        document.getElementById("userName").value =
            technician.userName || "";

        document.getElementById("userEmail").value =
            technician.userEmail || "";

        document.getElementById("phone").value =
            technician.phone || "";

    })

    .catch(error => {

        console.error(error);

        document.getElementById("message").innerText =
            "Failed to load technician";

    });


/* Update technician */

document.getElementById("technicianForm")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        const technicianData = {

            userName:
                document.getElementById("userName").value,

            userEmail:
                document.getElementById("userEmail").value,

            phone:
                document.getElementById("phone").value

        };

        fetch("/api/technician/update/" + technicianId, {

            method: "PUT",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify(technicianData)

        })

        .then(response => {

            if (!response.ok) {
                throw new Error("Update failed");
            }

            return response.json();

        })

        .then(updatedTechnician => {

            document.getElementById("message").innerText =
                "Technician updated successfully";

            document.getElementById("message")
                .className = "mt-3 text-success";

            setTimeout(() => {
                window.location.href = "/technician.html";
            }, 1000);

        })

        .catch(error => {

            console.error(error);

            document.getElementById("message").innerText =
                "Failed to update technician";

            document.getElementById("message")
                .className = "mt-3 text-danger";

        });

    });

</script>

</body>
</html>
